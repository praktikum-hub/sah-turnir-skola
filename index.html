<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Adamići - Šahovski Turnir</title>
    <style>
        /* Vizualni identitet prema ss-adamic.com */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 1000px; 
            margin: 30px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        /* Školski branding - Adamić tamnoplava */
        h1 { 
            color: #1e293b; 
            text-align: center; 
            font-size: 28px; 
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 16px;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        /* Moderni tabovi na temelju navigacije škole */
        .tabs { 
            display: flex; 
            justify-content: center; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #e2e8f0; 
        }
        .tab-btn { 
            padding: 12px 28px; 
            border: none; 
            background: none; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #64748b; 
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: #1e293b;
        }
        .tab-btn.active { 
            color: #2563eb; 
            border-bottom: 3px solid #2563eb; 
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Tablice s Adamić plavim naglascima */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            padding: 14px 16px; 
            text-align: left; 
            border-bottom: 1px solid #e2e8f0; 
        }
        th { 
            background-color: #f8fafc; 
            color: #475569; 
            font-weight: 600; 
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr:hover { background-color: #f8fafc; }
        
        /* Posebni elementi */
        .rank { 
            font-weight: bold; 
            color: #2563eb; 
            font-size: 16px;
        }
        .student-name {
            font-size: 15px;
            color: #1e293b;
        }
        
        /* Elo značka u stilu elemenata s Adamić web stranice */
        .badge-elo { 
            background-color: #dbeafe; 
            color: #1e40af; 
            padding: 5px 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: bold; 
            display: inline-block;
        }
        .badge-status {
            background-color: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 Adamići</h1>
    <div class="subtitle">Šahovska liga - Rezultati uživo</div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'rang-lista')">📊 Rang Lista</button>
        <button class="tab-btn" onclick="switchTab(event, 'povijest')">⏳ Povijest Mečeva</button>
    </div>

    <!-- TAB 1: RANG LISTA -->
    <div id="rang-lista" class="tab-content active">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%">Rang</th>
                        <th style="width: 35%">Ime i Prezime</th>
                        <th style="width: 17%">Elo Rejting</th>
                        <th style="width: 10%">Mečevi</th>
                        <th style="width: 10%; color: #16a34a;">Pob</th>
                        <th style="width: 10%; color: #ea580c;">Rem</th>
                        <th style="width: 10%; color: #dc2626;">Por</th>
                    </tr>
                </thead>
                <tbody id="tablica-rang">
                    <tr><td colspan="7" style="text-align:center; color:#64748b;">Učitavanje trenutnog poretka...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: POVIJEST -->
    <div id="povijest" class="tab-content">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%">ID</th>
                        <th style="width: 25%">Datum i Vrijeme</th>
                        <th style="width: 25%">Bijeli</th>
                        <th style="width: 25%">Crni</th>
                        <th style="width: 15%">Rezultat</th>
                    </tr>
                </thead>
                <tbody id="tablica-povijest">
                    <tr><td colspan="5" style="text-align:center; color:#64748b;">Učitavanje odigranih mečeva...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Automatski povlači vaše podatke s GitHub repozitorija
    const KORISNIK = "praktikum-hub";
    const REPO = "sah-turnir-skola";

    const URL_PODACI = `https://githubusercontent.com{KORISNIK}/${REPO}/main/sah_podaci.json`;
    const URL_POVIJEST = `https://githubusercontent.com{KORISNIK}/${REPO}/main/sah_povijest_meceva.json`;

    async function ucitajPodatke() {
        try {
            // 1. Dohvaćanje i obrada Rang Liste
            const odzivPodaci = await fetch(URL_PODACI);
            if (odzivPodaci.ok) {
                const podaci = await odzivPodaci.json();
                
                const sortirani = Object.entries(podaci).map(([ime, stats]) => ({ ime, ...stats }));
                sortirani.sort((a, b) => b.rejting - a.rejting || b.pobjede - a.pobjede);

                const tbodyRang = document.getElementById("tablica-rang");
                tbodyRang.innerHTML = "";
                
                sortirani.forEach((igrac, indeks) => {
                    tbodyRang.innerHTML += `
                        <tr>
                            <td class="rank">${indeks + 1}.</td>
                            <td class="student-name"><strong>${igrac.ime}</strong></td>
                            <td><span class="badge-elo">${igrac.rejting.toFixed(1)}</span></td>
                            <td><strong>${igrac.odigrano}</strong></td>
                            <td style="color:#16a34a; font-weight:600;">${igrac.pobjede}</td>
                            <td style="color:#ea580c; font-weight:600;">${igrac.remiji}</td>
                            <td style="color:#dc2626; font-weight:600;">${igrac.porazi}</td>
                        </tr>
                    `;
                });
            }
        } catch (e) {
            document.getElementById("tablica-rang").innerHTML = `<tr><td colspan="7" style="text-align:center; color:#dc2626;">Trenutno nema registriranih rezultata na turniru.</td></tr>`;
        }

        try {
            // 2. Dohvaćanje i obrada Povijesti mečeva
            const odzivPovijest = await fetch(URL_POVIJEST);
            if (odzivPovijest.ok) {
                const povijest = await odzivPovijest.json();
                const tbodyPovijest = document.getElementById("tablica-povijest");
                tbodyPovijest.innerHTML = "";

                // Najnoviji mečevi idu prvi na vrh tablice
                povijest.reverse().forEach(mec => {
                    tbodyPovijest.innerHTML += `
                        <tr>
                            <td><span style="color:#64748b; font-weight:500;">#${mec.id}</span></td>
                            <td style="color:#475569; font-size:14px;">${mec.datum}</td>
                            <td><strong>${mec.bijeli}</strong></td>
                            <td><strong>${mec.crni}</strong></td>
                            <td><span class="badge-status">${mec.ishod}</span></td>
                        </tr>
                    `;
                });
            }
        } catch (e) {
            document.getElementById("tablica-povijest").innerHTML = `<tr><td colspan="5" style="text-align:center; color:#dc2626;">Još nema evidentiranih mečeva u povijesti.</td></tr>`;
        }
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // Učitaj podatke prilikom učitavanja stranice
    ucitajPodatke();
</script>

</body>
</html>
